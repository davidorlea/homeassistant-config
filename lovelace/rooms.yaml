title: Rooms
path: rooms
icon: mdi:floor-plan
cards:
  - type: vertical-stack
    title: Outdoor
    cards:
      - type: horizontal-stack
        cards:
          - type: sensor
            name: Temperature
            graph: line
            entity: sensor.outdoor_temperature
          - type: sensor
            name: Humidity
            graph: line
            entity: sensor.outdoor_humidity
          - type: sensor
            name: Dew Point
            graph: line
            entity: sensor.outdoor_dew_point
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.outdoor_frontdoor_contact
            name: Frontdoor
            icon: mdi:door
            state_color: true
          - entity: binary_sensor.outdoor_backdoor_contact
            name: Backdoor
            icon: mdi:door
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: light.outdoor_frontdoor_light
            name: Frontdoor Light
          - entity: light.outdoor_backdoor_light
            name: Backdoor Light
  - type: vertical-stack
    title: Kitchen
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.kitchen_motion_sensor_occupancy
            name: Motion
            icon: mdi:motion-sensor
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: light.kitchen_ceiling_light
            name: Ceiling Light
          - entity: light.kitchen_counter_light
            name: Counter Light
          - entity: light.kitchen_sideboard_light
            name: Sideboard Light
      - type: entities
        show_header_toggle: false
        entities:
          - entity: fan.kitchen_fan
            name: Fan
          - entity: sensor.kitchen_fan_airflow
            name: Airflow
          - entity: sensor.history_stats_kitchen_fan
            name: Runtime Today
          - entity: sensor.kitchen_fan_air_exchanged_today
            name: Air Exchanged Today
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.kitchen_coffee_machine
            name: Coffee Machine
            icon: mdi:coffee-maker
            state_color: true
  - type: vertical-stack
    title: Living Room
    cards:
      - type: horizontal-stack
        cards:
          - type: sensor
            name: Temperature
            graph: line
            entity: sensor.living_room_multi_sensor_temperature
          - type: sensor
            name: Humidity
            graph: line
            entity: sensor.living_room_multi_sensor_humidity
          - type: sensor
            name: Dew Point
            graph: line
            entity: sensor.living_room_multi_sensor_dew_point
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.living_room_motion_sensor_occupancy
            name: Motion
            icon: mdi:motion-sensor
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: light.living_room_ceiling_light
            name: Ceiling Light
          - entity: light.living_room_ambient_light
            name: Ambient Light
          - entity: light.living_room_sofa_light
            name: Sofa Light
          - entity: light.living_room_tv_light
            name: TV Light
      - type: entities
        show_header_toggle: false
        entities:
          - entity: switch.living_room_tv
            name: TV
            icon: mdi:television
            state_color: true
  - type: vertical-stack
    title: Bedroom
    cards:
      - type: horizontal-stack
        cards:
          - type: sensor
            name: Temperature
            graph: line
            entity: sensor.bedroom_multi_sensor_temperature
          - type: sensor
            name: Humidity
            graph: line
            entity: sensor.bedroom_multi_sensor_humidity
          - type: sensor
            name: Dew Point
            graph: line
            entity: sensor.bedroom_multi_sensor_dew_point
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.bedroom_window_left_contact
            name: Window Left
            icon: mdi:window-closed-variant
            state_color: true
          - entity: binary_sensor.bedroom_window_right_contact
            name: Window Right
            icon: mdi:window-closed-variant
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.bedroom_motion_sensor_occupancy
            name: Motion
            icon: mdi:motion-sensor
            state_color: true
          - entity: binary_sensor.bedroom_bed_occupancy
            name: Bed Occupancy
            icon: mdi:bed
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: light.bedroom_ceiling_light
            name: Ceiling Light
          - entity: light.bedroom_bed_light
            name: Bed Light
          - entity: light.bedroom_cabinet_light
            name: Cabinet Light
          - entity: light.bedroom_dresser_light
            name: Dresser Light
  - type: vertical-stack
    title: Bathroom
    cards:
      - type: horizontal-stack
        cards:
          - type: sensor
            name: Temperature
            graph: line
            entity: sensor.bathroom_multi_sensor_temperature
          - type: sensor
            name: Humidity
            graph: line
            entity: sensor.bathroom_multi_sensor_humidity
          - type: sensor
            name: Dew Point
            graph: line
            entity: sensor.bathroom_multi_sensor_dew_point
      - type: entities
        show_header_toggle: false
        entities:
          - entity: fan.bathroom_fan
            name: Fan
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.bathroom_water_leak_sensor_water_leak
            name: Water Leak
            icon: mdi:home-flood
            state_color: true
  - type: vertical-stack
    title: Hall
    cards:
      - type: entities
        show_header_toggle: false
        entities:
          - entity: binary_sensor.hall_motion_sensor_occupancy
            name: Motion
            icon: mdi:motion-sensor
            state_color: true
      - type: entities
        show_header_toggle: false
        entities:
          - entity: light.hall_ceiling_light
            name: Ceiling Light
