- fan:
    - default_entity_id: fan.bathroom_fan
      name: Bathroom Fan
      unique_id: 1561d0b8-0b22-489b-88f7-471ffc7830e7
      availability: "{{ has_value('switch.bathrom_fan_switch') }}"
      state: "{{ states('switch.bathrom_fan_switch') }}"
      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.bathrom_fan_switch
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.bathrom_fan_switch

    - default_entity_id: fan.kitchen_fan
      name: Kitchen Fan
      unique_id: 2c710b8c-f09a-486c-94e3-d564aace35e3
      availability: "{{ has_value('switch.0x08ddebfffed785c0') }}"
      state: "{{ states('switch.0x08ddebfffed785c0') }}"
      turn_on:
        - action: switch.turn_on
          target:
            entity_id: switch.0x08ddebfffed785c0
      turn_off:
        - action: switch.turn_off
          target:
            entity_id: switch.0x08ddebfffed785c0

- sensor:
    - default_entity_id: sensor.bathroom_fan_airflow
      name: Bathroom Fan Airflow
      unique_id: f42cf08c-61e5-4fd5-847b-2da903eb8338
      state_class: measurement
      unit_of_measurement: m³/h
      icon: mdi:weather-windy
      availability: "{{ has_value('fan.bathroom_fan') }}"
      state: "{{ 105 if is_state('fan.bathroom_fan', 'on') else 0 }}"

    - default_entity_id: sensor.bathroom_fan_air_exchanged_today
      name: Bathroom Fan Air Exchanged Today
      unique_id: 02fcdc91-8e87-4eca-a884-396241337dc6
      unit_of_measurement: m³
      icon: mdi:air-filter
      availability: "{{ has_value('sensor.history_stats_bathroom_fan') }}"
      state: "{{ (states('sensor.history_stats_bathroom_fan') | float(0) * 105) | round(1) }}"

    - default_entity_id: sensor.kitchen_fan_airflow
      name: Kitchen Fan Airflow
      unique_id: 94e33b83-e33a-487a-93ba-d66a8be6934d
      state_class: measurement
      unit_of_measurement: m³/h
      icon: mdi:weather-windy
      availability: "{{ has_value('fan.kitchen_fan') }}"
      state: "{{ 78 if is_state('fan.kitchen_fan', 'on') else 0 }}"

    - default_entity_id: sensor.kitchen_fan_air_exchanged_today
      name: Kitchen Fan Air Exchanged Today
      unique_id: f4c6dcb1-f75e-4d45-91cd-1ef6d2a88d17
      unit_of_measurement: m³
      icon: mdi:air-filter
      availability: "{{ has_value('sensor.history_stats_kitchen_fan') }}"
      state: "{{ (states('sensor.history_stats_kitchen_fan') | float(0) * 78) | round(1) }}"
